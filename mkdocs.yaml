site_name: Interpretation Docs
theme:
  name: material

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: numpy
            show_root_heading: true
            show_source: true

nav:
  - Home: index.md
  - API Reference:
      - ICE Explainer: api/ice.md
      - Counterfactual Explainer: api/counterfactual.md
      - PyTorch Model Wrapper: api/pytorch_model.md
      - Tensorflow Model Wrapper: api/tf_model.md
      - Neural Network Visualiser: api/nnvis.md
      - Saliency Map: api/saliency.md

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js